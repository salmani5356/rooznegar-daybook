plugins { id 'com.android.application' }
android {
    namespace 'ir.rooznegar.daybook'
    compileSdk 35
    defaultConfig { applicationId 'ir.rooznegar.daybook'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1.0' }
    signingConfigs {
        release {
            // مقادیر از GitHub Secrets (در ساخت Release) خوانده می‌شود
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
