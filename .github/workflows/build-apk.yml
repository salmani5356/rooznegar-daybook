name: Build Android APK

# APK فقط آدرس منتشرشده‌ی سایت را در یک WebView باز می‌کند،
# پس فقط وقتی پوشه‌ی android یا همین فایل عوض شد نیاز به ساخت دوباره هست.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle -p android assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rooznegar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # نسخه‌ی Release امضاشده (برای مایکت و بازار) فقط وقتی ساخته می‌شود که Secrets تنظیم شده باشند.
      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed Release APK
        if: steps.sign.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rooznegar-release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/rooznegar-release.jks"
          gradle -p android assembleRelease

      - name: Upload Release APK
        if: steps.sign.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rooznegar-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
