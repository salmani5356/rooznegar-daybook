name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copy website files into Android
        run: |
          mkdir -p android/app/src/main/assets/public/assets
          cp index.html android/app/src/main/assets/public/index.html
          cp -r assets/. android/app/src/main/assets/public/assets/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rooznegar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
